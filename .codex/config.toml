# Canonical trusted-project Codex profile for Sentinel public pack.
# This file contains no secrets and is meant to stay versioned.
# Keep AGENT_DECISION_MCP_TOKEN in the local shell only.

approval_policy = "untrusted"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = false

[mcp_servers.agent_decision_plane_public]
url = "https://decision-mcp.frenchlink.fr/mcp?adp_client=codex"
bearer_token_env_var = "AGENT_DECISION_MCP_TOKEN"
enabled = true
required = true
startup_timeout_sec = 20
tool_timeout_sec = 60
enabled_tools = [
  "evaluate_execution_decision",
  "simulate_execution_decision",
  "list_policy_packs",
  "explain_decision",
]
